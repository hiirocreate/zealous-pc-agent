# Windows 用インストーラー ZealousSetup.exe を作る。
# main への push: ビルドできるかの確認のみ
# 手動実行(Actions > build-installer > Run workflow): バージョンを入れると Releases に公開、空なら成果物(Artifacts)に置く
# v から始まるタグ(例: v1.0.0)を push: Releases に公開する
#   配信用の公開リポジトリへ直接置くには(リポジトリの Settings > Secrets and variables > Actions):
#     変数   RELEASE_REPO  … 配信用リポジトリ(例: hiirocreate/zealous-releases)
#     秘密   RELEASE_TOKEN … そのリポジトリに書き込めるトークン(Contents: Read and write)
#   未設定なら、このリポジトリの Releases に置く
name: build-installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "公開するバージョン(例: 1.0.0)。空ならビルドの確認だけ"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 前の版からの変更点(更新内容)を作るため

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 部品をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: テスト
        run: python -m pytest -q tests

      - name: バージョンを決める(タグ v1.2.3 / 手動実行の入力)
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then echo "VERSION = \"$v\"" > version.py; fi

      - name: Zealous.exe を作る(Python 同梱)
        run: >
          pyinstaller zealous.pyw --noconfirm --windowed --name Zealous
          --icon assets/zealous.ico --add-data "assets;assets"
          --collect-all customtkinter --collect-all faster_whisper --collect-all ctranslate2
          --collect-all _sounddevice_data --collect-all kokoro_onnx --collect-all misaki --collect-all unidic_lite
          --collect-all fugashi --collect-all espeakng_loader --collect-all phonemizer --collect-all markitdown --collect-all magika
          --collect-all sqlite_vec --collect-all onnxruntime --collect-all language_tags --collect-all pdfminer
          --hidden-import py7zr --hidden-import audiogate --hidden-import kokoro_tts --hidden-import vision --hidden-import semantic
          --collect-data docx --collect-data pptx --hidden-import docx --hidden-import pptx --hidden-import openpyxl --hidden-import pypdf
          --hidden-import llm --hidden-import tools --hidden-import app --hidden-import setup_wizard
          --hidden-import updater --hidden-import smoketest --hidden-import whisper_worker --hidden-import zlog --hidden-import voice_mode --hidden-import orb --hidden-import screen --hidden-import persona --hidden-import weather --hidden-import memory --hidden-import reading --hidden-import tooltip --hidden-import browser --hidden-import mail --hidden-import secret --hidden-import mail_ui --hidden-import mictest --hidden-import officedoc --hidden-import fonts --hidden-import attachments --hidden-import dropfiles --hidden-import filecard --hidden-import loaders

      - name: 起動確認(すべての部品が exe から読み込めるか)
        shell: pwsh
        run: |
          $p = Start-Process dist\Zealous\Zealous.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "読み込みに失敗した部品があります" }

      - name: "動作確認(実際に画面を動かす: 表示・文字入力・端のドラッグ・音声認識・送信)"
        shell: pwsh
        run: |
          $out = "$PWD\smoke"
          $p = Start-Process dist\Zealous\Zealous.exe -ArgumentList "--smoketest", $out -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "時間切れ" }
          if (Test-Path "$out\results.txt") { Get-Content "$out\results.txt" } else { Write-Host "results.txt がありません(強制終了した可能性)" }
          if (Test-Path "$env:APPDATA\Zealous\crash.log") { Write-Host "--- crash.log"; Get-Content "$env:APPDATA\Zealous\crash.log" }
          if (Test-Path "$env:APPDATA\Zealous\error.log") { Write-Host "--- error.log"; Get-Content "$env:APPDATA\Zealous\error.log" }
          python packaging\show_shots.py $out
          if (-not (Select-String -Path "$out\results.txt" -Pattern "ALL DONE" -Quiet -ErrorAction SilentlyContinue)) { throw "動作確認が最後まで終わりませんでした" }

      - name: インストーラーを作る
        shell: pwsh
        run: |
          $ver = if ("${{ steps.ver.outputs.version }}") { "${{ steps.ver.outputs.version }}" } else { "1.0.0" }
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\installer.iss

      - name: "更新の確認(Zealous が動いたまま、もう一度インストールできるか)"
        shell: pwsh
        run: |
          $setup = "$PWD\dist\ZealousSetup.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$PWD\install1.log" -PassThru
          # -Wait はインストーラーが起動し直した Zealous の終了まで待ってしまうので、インストーラーだけを待つ
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "インストーラーが終わりませんでした" }
          if ($p.ExitCode -ne 0) { Get-Content install1.log -Tail 30; throw "初回インストールに失敗 ($($p.ExitCode))" }
          # 動いている状態を作る: 本体と、本体のフォルダの部品を使う別のプロセス(部品の代わり)
          $app = "$env:LOCALAPPDATA\Programs\Zealous"
          Start-Process "$app\Zealous.exe"
          $fake = "$env:LOCALAPPDATA\Zealous\fake"
          New-Item -ItemType Directory -Force $fake | Out-Null
          Copy-Item "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" "$fake\run.exe"
          Start-Process "$fake\run.exe" -ArgumentList "-NoProfile", "-Command", "`$f=[IO.File]::Open('$app\_internal\msvcp140.dll','Open','Read','Read'); Start-Sleep 600" -WindowStyle Hidden
          Start-Sleep 10
          Get-Process | Where-Object { $_.Path -like "$app\*" -or $_.Path -like "$fake\*" } | Format-Table Id, Path
          $t = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$PWD\install2.log" -PassThru
          # -Wait はインストーラーが起動し直した Zealous の終了まで待ってしまうので、インストーラーだけを待つ
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "インストーラーが終わりませんでした" }
          Write-Host "更新にかかった時間: $($t.Elapsed.TotalSeconds) 秒 / 終了コード $($p.ExitCode)"
          Write-Host "入れ替えたファイルの数: $((Get-ChildItem dist\Zealous -Recurse -File).Count)"
          Select-String -Path install2.log -Pattern "taskkill|残り確認|Error|エラー|DeleteFile" | Select-Object -First 20
          Get-Process | Where-Object { $_.Path -like "$app\*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content install2.log -Tail 40; throw "Zealous が動いたままでは更新できませんでした" }

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && steps.ver.outputs.version == ''
        continue-on-error: true  # 保存容量の上限に達していてもビルド自体は成功扱い
        with:
          name: ZealousSetup
          path: dist/ZealousSetup.exe
          retention-days: 3

      - name: インストーラーの指紋(SHA-256)を作る(更新時に、取得したファイルが本物か確かめるため)
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\ZealousSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ZealousSetup.exe" | Out-File -Encoding ascii -NoNewline dist\ZealousSetup.exe.sha256
          Get-Content dist\ZealousSetup.exe.sha256

      - name: 更新内容を作る(前の版からのコミットの題名)
        if: steps.ver.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
        run: python packaging/release_notes.py ${{ steps.ver.outputs.version }}

      - name: 配信用リポジトリの Releases に公開
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          # 未設定ならこのリポジトリの Releases に置く
          repository: ${{ vars.RELEASE_REPO || github.repository }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ steps.ver.outputs.version }}
          # 配信用リポジトリへ置くときは、そのリポジトリの main に付ける(このリポジトリのコミットは向こうに無い)
          target_commitish: ${{ vars.RELEASE_REPO && 'main' || github.sha }}
          name: Zealous v${{ steps.ver.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/ZealousSetup.exe
            dist/ZealousSetup.exe.sha256

      - name: ダウンロードページを更新(配信用リポジトリの docs/ を GitHub Pages で公開)
        if: steps.ver.outputs.version != '' && vars.RELEASE_REPO != ''
        continue-on-error: true  # ページの更新に失敗しても、リリース自体は成功扱い
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
        run: python packaging/publish_site.py ${{ steps.ver.outputs.version }}
