# Windows 用インストーラー ZealousSetup.exe を作る。
# main への push: ビルドできるかの確認のみ / 手動実行: 成果物(Artifacts)に置く
# v から始まるタグ(例: v1.0.0)を push: 配信用の公開リポジトリの Releases に公開する
#   必要な設定(リポジトリの Settings > Secrets and variables > Actions):
#     変数   RELEASE_REPO  … 配信用リポジトリ(例: hiirocreate/zealous-releases)
#     秘密   RELEASE_TOKEN … そのリポジトリに書き込めるトークン(Contents: Read and write)
name: build-installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 部品をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: テスト
        run: python -m pytest -q tests

      - name: バージョンを設定(タグ v1.2.3 → 1.2.3)
        if: github.ref_type == 'tag'
        shell: bash
        run: echo "VERSION = \"${GITHUB_REF_NAME#v}\"" > version.py

      - name: Zealous.exe を作る(Python 同梱)
        run: >
          pyinstaller zealous.pyw --noconfirm --windowed --name Zealous
          --icon assets/zealous.ico --add-data "assets;assets"
          --collect-all customtkinter --collect-all faster_whisper --collect-all ctranslate2
          --collect-all _sounddevice_data
          --hidden-import llm --hidden-import tools --hidden-import app --hidden-import setup_wizard
          --hidden-import updater

      - name: 起動確認(すべての部品が exe から読み込めるか)
        shell: pwsh
        run: |
          $p = Start-Process dist\Zealous\Zealous.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "読み込みに失敗した部品があります" }

      - name: インストーラーを作る
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0" }
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\installer.iss

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ZealousSetup
          path: dist/ZealousSetup.exe
          retention-days: 3

      - name: 配信用リポジトリの Releases に公開
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # 未設定ならこのリポジトリの Releases に置く
          repository: ${{ vars.RELEASE_REPO || github.repository }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ github.ref_name }}
          name: Zealous ${{ github.ref_name }}
          files: dist/ZealousSetup.exe
